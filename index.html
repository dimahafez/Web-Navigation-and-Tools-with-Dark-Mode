<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            flex-direction: column;
        }
        body.dark-mode {
            background-color: #121212;
            color: white;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            transition: background-color 0.3s ease;
        }
        body.dark-mode .container {
            background-color: #1e1e1e;
        }
        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
        .highlight {
            font-weight: bold;
            color: #007bff;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .loading {
            display: none;
            font-size: 18px;
            color: #007bff;
        }
    </style>
    <script>
        // Toggle Dark Mode
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        // Function to navigate to another page with a loading effect
        function startJourney() {
            // Show loading message
            document.getElementById('loading').style.display = 'block';
            // Hide the button to prevent multiple clicks
            document.querySelector('button').style.display = 'none';

            setTimeout(() => {
                location = "main.html";  // Change this to "main.html" as requested
            }, 2000);  // Wait for 2 seconds before navigating
        }
    </script>
</head>
<body>
    <!-- Button to toggle Dark Mode (right side) -->
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">Toggle Dark Mode</button>

    <div class="container">
        <h1>Welcome to [Your Website]!</h1>
        <p>We're thrilled to have you here, let's get started.</p>
        <!-- Start button that leads to main.html -->
        <button onclick="startJourney()">Start</button>
        <p id="loading" class="loading">Loading... Please wait</p>
    </div>
</body>
</html>
